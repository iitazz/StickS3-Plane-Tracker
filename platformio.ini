[platformio]
build_dir = builds

[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:platformio_extra.py
lib_deps =
    m5stack/M5Unified@^0.2.9
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
